# Overrides locais — NÃO commitar. Arquivo é carregado automaticamente
# pelo `docker compose` sobrepondo docker-compose.yml.
services:
  whatsmiau:
    environment:
      - PORT=8081
      - REDIS_URL=redis:6379
      - DIALECT_DB=postgres
      - DB_URL=postgres://whatsmiau:whatsmiau123@db:5432/whatsmiau?sslmode=disable
      - API_KEY=cartzap-local-key-123
      - DEBUG_MODE=true
      - DEBUG_WHATSMEOW=false
    depends_on:
      - redis
      - db

  redis:
    container_name: whatsmiau-redis

  db:
    image: postgres:16
    container_name: whatsmiau-postgres
    environment:
      POSTGRES_USER: whatsmiau
      POSTGRES_PASSWORD: whatsmiau123
      POSTGRES_DB: whatsmiau
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg-data:
